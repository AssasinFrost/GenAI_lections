name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv coverage  # <-- добавили coverage

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh

    - name: Start Ollama server
      run: |
        ollama serve &
        sleep 10

    - name: Pull model
      run: |
        ollama pull hf.co/unsloth/Qwen3.5-4B-GGUF:Q4_K_S

    - name: Run tests with coverage
      run: |
        coverage run -m unittest discover tests -v
        coverage lcov -o coverage.lcov  # <-- генерируем отчет в формате lcov

    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: coverage.lcov
        github-token: ${{ secrets.GITHUB_TOKEN }}  # <-- этот токен уже есть в репозитории